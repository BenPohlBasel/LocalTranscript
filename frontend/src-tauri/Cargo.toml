[package]
name = "localtranscript-app"
version = "2.0.0"
description = "LocalTranscript — Tauri-Shell (spawnt das Python-Backend)"
authors = ["Ben Pohl / BIAS.City"]
edition = "2021"

[lib]
name = "localtranscript_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
