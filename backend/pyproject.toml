[project]
name = "localtranscript"
version = "2.1.3"
description = "LocalTranscript — offline Transkription (whisper.cpp) mit Sprecher-Diarisierung, Editor und enrich-Export"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "enrich-core",
    # Diarisierung
    "speechbrain>=1.0.0",
    "silero-vad>=5.1",
    "scikit-learn>=1.3.0",
    "torch>=2.4",
    "torchaudio>=2.4",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.uv.sources]
# Side-Projekt von enrich: enrich-core liegt als Geschwister-Checkout.
# Der gebaute App-Bundle-venv trägt es mit; ein frischer Clone braucht
# ../enrich (README).
enrich-core = { path = "../../enrich/packages/enrich-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localtranscript"]

[tool.ruff]
line-length = 79
# Gevendorte enrich-Bausteine bleiben BYTE-IDENTISCH zur Quelle
# (Drift-Guard-Test) — ruff darf sie nie "fixen".
exclude = ["src/localtranscript/enrich_export/textsatz.py",
           "src/localtranscript/enrich_export/schrift.py",
           "src/localtranscript/enrich_export/turns.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# FastAPI-Idiom (B008 File(...)), bewusste returncode-Prüfungen statt
# check=True, Vendor-Code-Stil — keine echten Defekte.
ignore = ["B008", "S110", "PLW1510", "ASYNC230"]
